<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="agy-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="agy-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Orbital ring 1 -->
  <ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="url(#agy-grad-1)" stroke-width="4" transform="rotate(-35 50 50)" filter="url(#glow)"/>
  <!-- Orbital ring 2 -->
  <ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="url(#agy-grad-2)" stroke-width="4" transform="rotate(35 50 50)"/>
  <!-- Core glowing body -->
  <circle cx="50" cy="50" r="11" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="14" fill="#60A5FA" fill-opacity="0.35"/>
  <!-- Satellite nodes -->
  <circle cx="78" cy="34" r="4.5" fill="#38BDF8"/>
  <circle cx="22" cy="66" r="4" fill="#34D399"/>
</svg>