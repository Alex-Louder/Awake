<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sill-mac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sill-stream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>
  <!-- Background Mac Display -->
  <rect x="6" y="14" width="64" height="44" rx="7" fill="url(#sill-mac)" stroke="#64748B" stroke-width="2.5"/>
  <rect x="11" y="19" width="54" height="34" rx="4" fill="#0A0E1A"/>
  <!-- Mac Stand -->
  <path d="M28 58h20v6H28z" fill="#475569"/>
  <rect x="22" y="64" width="32" height="3" rx="1.5" fill="#64748B"/>
  
  <!-- Foreground iPad Stream Display (tilted forward & elevated) -->
  <rect x="38" y="28" width="56" height="54" rx="9" fill="#030712" stroke="url(#sill-stream)" stroke-width="3"/>
  <rect x="43" y="33" width="46" height="44" rx="6" fill="url(#sill-stream)" fill-opacity="0.2"/>
  
  <!-- 120 Hz Lightning / Refresh Stream Waves -->
  <path d="M54 55l14-14m0 0h-10m10 0v10" stroke="#00D2FF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 55l-14 14m0 0h10m-10 0v-10" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mini Notch/Camera -->
  <circle cx="66" cy="31" r="1.5" fill="#64748B"/>
</svg>